# Example AAMAD project configuration.
# Copy to aamad.config.yml and adjust for your project.
# See aamad-config-template.yml in your IDE templates folder
# (.cursor/templates, .claude/templates, .github/templates, or .kiro/templates).

version: 1

project:
  # Written by `aamad init`. greenfield = start from scratch; brownfield = existing repo.
  mode: greenfield  # greenfield | brownfield

runtime:
  # Greenfield `aamad init` writes this when you pick an adapter (not "choose later").
  target: crewai

language:
  primary: python
  secondary: []

libraries:
  approved: []
  forbidden: []

ui:
  theme: system
  visual_style: minimal
  prefer_modals: false
  design_system_mode: create  # create | adopt | extend
  design_system_source: ""    # workspace-relative path; required when mode is adopt

coding_standards:
  style_guide: ""
  type_checking: true
  max_file_lines: 400

security:
  require_security_assessment: true
  forbid_committed_secrets: true
  dependency_audit: true

documentation:
  require_user_guide: true
  sync_docs_after_code_changes: true

testing:
  require_unit_tests: true
  require_integration_tests: true
  map_to_acceptance_criteria: true
  require_visual_regression: false  # warning-only when true and UI is in scope
