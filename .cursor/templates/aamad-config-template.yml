# AAMAD project configuration
# Copy to project root as aamad.config.yml (or use aamad.config.example.yml).
# Personas load this file when present and honor preferences unless PRD/SAD conflict
# (record conflicts under Open Questions — do not silently override PRD/SAD).

version: 1

project:
  # Written by `aamad init`. greenfield = start from scratch; brownfield = existing repo.
  mode: greenfield  # greenfield | brownfield

runtime:
  # Prefer AAMAD_TARGET_RUNTIME env for adapter selection; this documents intent.
  # Greenfield `aamad init` writes target when you pick an adapter (not "choose later").
  target: crewai  # crewai | claude-agent-sdk | cursor-sdk

language:
  primary: python  # e.g. python | typescript
  secondary: []    # optional additional languages

libraries:
  approved: []     # allow-list of preferred libraries/frameworks
  forbidden: []    # hard bans for this project

ui:
  theme: system    # light | dark | system
  visual_style: minimal
  prefer_modals: false

coding_standards:
  style_guide: ""  # e.g. ruff / eslint / google
  type_checking: true
  max_file_lines: 400

security:
  require_security_assessment: true
  forbid_committed_secrets: true
  dependency_audit: true

documentation:
  require_user_guide: true
  sync_docs_after_code_changes: true

testing:
  require_unit_tests: true
  require_integration_tests: true
  map_to_acceptance_criteria: true
